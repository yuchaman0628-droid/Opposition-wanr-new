<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opposition‐WAR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Impact', 'Segoe UI', sans-serif;
            user-select: none;
        }

        /* --- タイトル画面 --- */
        #select-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(20,30,40,0.95) 0%, rgba(5,5,10,0.98) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 100;
        }

        #select-screen h1 {
            font-size: 64px;
            margin: 0 0 10px 0;
            letter-spacing: 5px;
            color: #ff3300;
            text-shadow: 0 0 20px #ff3300, 3px 3px 0px #000;
        }

        #select-screen p {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .card-container {
            display: flex;
            gap: 40px;
        }

        .select-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #ff3300;
            border-radius: 8px;
            padding: 30px;
            width: 240px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 0 15px rgba(255, 51, 0, 0.2);
        }

        .select-card:hover {
            background: rgba(ff, 51, 0, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 51, 0, 0.6);
        }

        .select-card h2 {
            margin-top: 0;
            color: #fff;
            font-size: 28px;
        }

        /* --- ゲームUI (HUD) --- */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: none;
            box-sizing: border-box;
        }

        /* 画面上部：敵のHP表示エリア */
        #enemy-hp-container {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }

        .enemy-hp-card {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ff3333;
            padding: 8px 15px;
            border-radius: 5px;
            width: 180px;
            text-align: center;
            color: #fff;
            box-shadow: 0 0 10px rgba(255,0,0,0.3);
        }

        .enemy-hp-title {
            font-size: 14px;
            margin-bottom: 4px;
            color: #ff6666;
            letter-spacing: 1px;
        }

        .enemy-hp-bar-bg {
            width: 100%;
            height: 12px;
            background: #333;
            border-radius: 3px;
            overflow: hidden;
        }

        .enemy-hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #ff3300, #ff6600);
            transition: width 0.1s;
        }

        /* 画面下部：自分のHP表示エリア（大きく表示） */
        #player-hp-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 500px;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #00ffcc;
            border-radius: 10px;
            padding: 15px 25px;
            box-shadow: 0 0 25px rgba(0, 255, 204, 0.4);
            text-align: center;
        }

        .player-hp-header {
            display: flex;
            justify-content: space-between;
            color: #00ffcc;
            font-size: 22px;
            margin-bottom: 8px;
            letter-spacing: 2px;
        }

        .player-hp-bar-bg {
            width: 100%;
            height: 28px;
            background: #112222;
            border-radius: 6px;
            overflow: hidden;
            border: 1px solid #00ffcc;
        }

        .player-hp-bar-fill {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00aa66, #00ffcc);
            transition: width 0.15s;
            box-shadow: 0 0 15px #00ffcc;
        }

        /* 操作説明 */
        #controls-hint {
            position: absolute;
            bottom: 10px;
            left: 20px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            font-family: sans-serif;
        }

        /* リザルト画面 */
        #result-screen {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #fff;
            display: none;
            z-index: 150;
            background: rgba(0,0,0,0.9);
            padding: 40px 80px;
            border-radius: 10px;
            border: 2px solid #ff3300;
            box-shadow: 0 0 50px rgba(255,51,0,0.5);
        }

        #result-title {
            font-size: 60px;
            margin-bottom: 20px;
            letter-spacing: 4px;
        }

        .btn-retry {
            padding: 12px 35px;
            font-size: 22px;
            background: #ff3300;
            border: none;
            color: #fff;
            cursor: pointer;
            font-weight: bold;
            letter-spacing: 2px;
            border-radius: 4px;
            transition: 0.2s;
        }

        .btn-retry:hover {
            background: #ff6600;
            box-shadow: 0 0 15px #ff6600;
        }
    </style>
    <!-- Three.js 3Dライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 1. タイトル/マシン選択画面 -->
    <div id="select-screen">
        <h1>Opposition‐WAR</h1>
        <p>SELECT YOUR MACHINE</p>
        <div class="card-container">
            <div class="select-card" onclick="startGame('TANK')">
                <h2>重戦車 (TANK)</h2>
                <p>圧倒的装甲と主砲力<br>VS バイク 2体</p>
            </div>
            <div class="select-card" onclick="startGame('BIKE')">
                <h2>高機動バイク (BIKE)</h2>
                <p>超スピードと連射力<br>VS 戦車 2体</p>
            </div>
        </div>
    </div>

    <!-- 2. HUD (ゲーム操作画面UI) -->
    <div id="hud">
        <!-- 画面上部：敵のHP -->
        <div id="enemy-hp-container"></div>

        <!-- 画面下部：自分のHP（大きく表示） -->
        <div id="player-hp-container">
            <div class="player-hp-header">
                <span id="player-name">YOUR MACHINE</span>
                <span id="player-hp-text">100 / 100</span>
            </div>
            <div class="player-hp-bar-bg">
                <div id="player-hp-fill" class="player-hp-bar-fill"></div>
            </div>
        </div>

        <div id="controls-hint">[W][A][S][D] 移動 | [SPACE] 攻撃 | [Shift] ブースト(バイク)</div>
    </div>

    <!-- 3. リザルト画面 -->
    <div id="result-screen">
        <div id="result-title">VICTORY</div>
        <button class="btn-retry" onclick="location.reload()">RETRY</button>
    </div>

    <script>
        // --- Web Audio API（効果音＆BGM合成エンジン） ---
        let audioCtx = null;
        let bgmInterval = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        // 砲撃音
        function playShootSound(isHeavy) {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            
            // ノイズ生成
            const bufferSize = audioCtx.sampleRate * (isHeavy ? 0.4 : 0.15);
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(isHeavy ? 800 : 2500, now);
            filter.frequency.exponentialRampToValueAtTime(40, now + (isHeavy ? 0.4 : 0.15));

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(isHeavy ? 1.0 : 0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + (isHeavy ? 0.4 : 0.15));

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start(now);
        }

        // 爆発音
        function playExplosionSound() {
            if (!audioCtx) return;
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.8;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(500, now);
            filter.frequency.exponentialRampToValueAtTime(20, now + 0.8);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1.2, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.8);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);

            noise.start(now);
        }

        // 簡易BGMループ生成（重厚なダークシンセ）
        function startBGM() {
            if (!audioCtx) return;
            let noteIndex = 0;
            const notes = [60, 63, 58, 55, 60, 63, 65, 58]; // ド・ミ♭・シ♭...

            bgmInterval = setInterval(() => {
                if (gameState !== 'PLAYING') return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                const freq = 440 * Math.pow(2, (notes[noteIndex] - 69) / 12);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq / 2, now); // 低音

                gain.gain.setValueAtTime(0.12, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(400, now);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start(now);
                osc.stop(now + 0.38);

                noteIndex = (noteIndex + 1) % notes.length;
            }, 200);
        }


        // --- Three.js 3D世界構築 ---
        let scene, camera, renderer;
        let player, playerType = 'TANK';
        let playerHp = 100, maxHp = 100;
        let playerSpeed = 0, maxSpeed = 0.22, rotSpeed = 0.025;
        
        const bullets = [];
        const enemies = [];
        const particles = [];
        const keys = {};
        let gameState = 'SELECT';
        let cameraShake = 0;

        // 地面テクスチャ作成
        function createGroundTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#222b1e'; ctx.fillRect(0, 0, 512, 512);

            for (let i = 0; i < 40000; i++) {
                const x = Math.random() * 512, y = Math.random() * 512;
                const val = Math.floor(Math.random() * 25);
                ctx.fillStyle = `rgba(${30 + val}, ${40 + val}, ${20 + val}, 0.2)`;
                ctx.fillRect(x, y, 2, 2);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(40, 40);
            return texture;
        }

        // リアルな戦車モデル
        function createDetailedTank(isEnemy = false) {
            const tank = new THREE.Group();
            const color = isEnemy ? 0x662222 : 0x2e4020;
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.4 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.8 });
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.3 });

            // 車体
            const body = new THREE.Mesh(new THREE.BoxGeometry(3.6, 1.1, 5.5), bodyMat);
            body.position.y = 0.95; body.castShadow = true;
            tank.add(body);

            // 履帯
            [-2.0, 2.0].forEach(x => {
                const tread = new THREE.Mesh(new THREE.BoxGeometry(0.85, 1.2, 5.8), darkMat);
                tread.position.set(x, 0.8, 0);
                tread.castShadow = true;
                tank.add(tread);
            });

            // 砲塔
            const turret = new THREE.Group();
            turret.position.set(0, 1.6, 0.1);
            const turretMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.8, 1.0, 14), bodyMat);
            turretMesh.position.y = 0.5; turretMesh.castShadow = true;
            turret.add(turretMesh);

            // 主砲
            const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.24, 4.5, 16), metalMat);
            cannon.rotation.x = Math.PI / 2;
            cannon.position.set(0, 0.6, 2.5);
            cannon.castShadow = true;
            turret.add(cannon);

            tank.add(turret);
            tank.userData = { cannonWorldPos: new THREE.Vector3() };
            return tank;
        }

        // リアルなバイクモデル
        function createDetailedBike(isEnemy = false) {
            const bike = new THREE.Group();
            const color = isEnemy ? 0xcc2222 : 0x0088cc;
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2, metalness: 0.7 });
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.8 });
            const chromeMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.1 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.7, 2.0), bodyMat);
            body.position.y = 1.0; body.castShadow = true;
            bike.add(body);

            const wheelGeo = new THREE.CylinderGeometry(0.55, 0.55, 0.3, 20);
            [-1.3, 1.3].forEach(z => {
                const wheel = new THREE.Mesh(wheelGeo, frameMat);
                wheel.rotation.z = Math.PI / 2;
                wheel.position.set(0, 0.55, z);
                wheel.castShadow = true;
                bike.add(wheel);
            });

            // ライダー
            const rider = new THREE.Mesh(new THREE.SphereGeometry(0.32, 12, 12), frameMat);
            rider.position.set(0, 1.6, 0.1);
            bike.add(rider);

            return bike;
        }

        // エンジン初期化
        function initEngine() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x8caec9, 0.005);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            // ライティング
            scene.add(new THREE.AmbientLight(0xffffff, 0.45));
            const dirLight = new THREE.DirectionalLight(0xfffaed, 0.85);
            dirLight.position.set(100, 150, 80);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 2048; dirLight.shadow.mapSize.height = 2048;
            dirLight.shadow.camera.near = 0.5; dirLight.shadow.camera.far = 400;
            const d = 100;
            dirLight.shadow.camera.left = -d; dirLight.shadow.camera.right = d;
            dirLight.shadow.camera.top = d; dirLight.shadow.camera.bottom = -d;
            scene.add(dirLight);

            // 地面
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(600, 600),
                new THREE.MeshStandardMaterial({ map: createGroundTexture(), roughness: 0.85 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('resize', onWindowResize);
        }

        // ゲーム開始
        function startGame(type) {
            initAudio();
            playerType = type;
            document.getElementById('select-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';

            if (playerType === 'TANK') {
                player = createDetailedTank(false);
                maxHp = 100; playerHp = 100;
                maxSpeed = 0.22; rotSpeed = 0.025;
                document.getElementById('player-name').innerText = '重戦車 (YOUR TANK)';
                
                // バイクを「2体」生成（要望通り）
                spawnEnemy('BIKE', 'バイク A');
                spawnEnemy('BIKE', 'バイク B');
            } else {
                player = createDetailedBike(false);
                maxHp = 60; playerHp = 60;
                maxSpeed = 0.48; rotSpeed = 0.045;
                document.getElementById('player-name').innerText = '高機動バイク (YOUR BIKE)';

                // 戦車 2体
                spawnEnemy('TANK', '重戦車 ALPHA');
                spawnEnemy('TANK', '重戦車 BETA');
            }

            scene.add(player);
            updatePlayerHPUI();
            startBGM();

            gameState = 'PLAYING';
            animate();
        }

        // 敵の生成
        function spawnEnemy(type, name) {
            let enemyObj;
            const angle = Math.random() * Math.PI * 2;
            const dist = 55 + Math.random() * 20;

            if (type === 'BIKE') {
                enemyObj = createDetailedBike(true);
                enemyObj.userData = { type: 'BIKE', name: name, hp: 35, maxHp: 35, speed: 0.24, radius: 2.2 };
            } else {
                enemyObj = createDetailedTank(true);
                enemyObj.scale.set(1.2, 1.2, 1.2);
                enemyObj.userData = { type: 'TANK', name: name, hp: 120, maxHp: 120, speed: 0.09, radius: 3.5, shootCooldown: 0 };
            }

            enemyObj.position.x = Math.sin(angle) * dist;
            enemyObj.position.z = Math.cos(angle) * dist;
            scene.add(enemyObj);
            enemies.push(enemyObj);

            createEnemyHPUI(enemyObj);
        }

        // 敵HP UI作成
        function createEnemyHPUI(enemy) {
            const container = document.getElementById('enemy-hp-container');
            const card = document.createElement('div');
            card.className = 'enemy-hp-card';
            card.id = `hp-card-${enemies.indexOf(enemy)}`;
            card.innerHTML = `
                <div class="enemy-hp-title">${enemy.userData.name}</div>
                <div class="enemy-hp-bar-bg">
                    <div class="enemy-hp-bar-fill" id="hp-fill-${enemies.indexOf(enemy)}"></div>
                </div>
            `;
            container.appendChild(card);
        }

        // 射撃（修正点：判定を強化して当たらない問題を完全に解消）
        let lastShotTime = 0;
        function shoot(shooter, isPlayer = false) {
            const now = Date.now();
            const isHeavy = (isPlayer && playerType === 'TANK') || (!isPlayer && shooter.userData.type === 'TANK');
            const coolTime = isHeavy ? 500 : 120;

            if (isPlayer && now - lastShotTime < coolTime) return;
            if (isPlayer) lastShotTime = now;

            playShootSound(isHeavy);
            if (isHeavy) cameraShake = 0.4; // 画面振動

            const bulletGeo = new THREE.SphereGeometry(isHeavy ? 0.4 : 0.2, 8, 8);
            const bulletMat = new THREE.MeshBasicMaterial({ color: isPlayer ? 0xffff00 : 0xff3300 });
            const bullet = new THREE.Mesh(bulletGeo, bulletMat);

            const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(shooter.quaternion);
            const spawnY = isHeavy ? 2.2 : 1.1;
            bullet.position.copy(shooter.position).add(new THREE.Vector3(0, spawnY, 0)).add(dir.clone().multiplyScalar(2.8));

            // マズルフラッシュ（発砲時の光）
            const flash = new THREE.PointLight(0xffaa00, 3, 10);
            flash.position.copy(bullet.position);
            scene.add(flash);
            setTimeout(() => scene.remove(flash), 50);

            bullet.userData = { 
                velocity: dir.multiplyScalar(isHeavy ? 1.4 : 1.8), 
                life: 80, 
                isPlayerBullet: isPlayer,
                damage: isHeavy ? 40 : 12,
                hitRadius: isHeavy ? 2.8 : 1.8 // ★判定エリアを大きく設定して命中しやすく
            };

            scene.add(bullet);
            bullets.push(bullet);
        }

        // 爆発エフェクト
        function createExplosion(pos, isBig = false) {
            playExplosionSound();
            cameraShake = isBig ? 0.8 : 0.3;

            const count = isBig ? 35 : 15;
            for (let i = 0; i < count; i++) {
                const p = new THREE.Mesh(
                    new THREE.SphereGeometry(Math.random() * 0.4 + 0.1, 6, 6),
                    new THREE.MeshBasicMaterial({ color: Math.random() > 0.3 ? 0xff4500 : 0xffcc00 })
                );
                p.position.copy(pos);
                p.userData = {
                    vel: new THREE.Vector3(
                        (Math.random() - 0.5) * 0.8,
                        (Math.random() - 0.2) * 0.6,
                        (Math.random() - 0.5) * 0.8
                    ),
                    life: 30
                };
                scene.add(p);
                particles.push(p);
            }
        }

        // メインゲームループ
        function animate() {
            if (gameState !== 'PLAYING') return;
            requestAnimationFrame(animate);

            // 1. プレイヤー操作
            let currentMaxSpeed = maxSpeed;
            if (keys['ShiftLeft'] && playerType === 'BIKE') currentMaxSpeed *= 1.5;

            if (keys['KeyW']) playerSpeed = Math.min(playerSpeed + 0.01, currentMaxSpeed);
            else if (keys['KeyS']) playerSpeed = Math.max(playerSpeed - 0.01, -currentMaxSpeed * 0.5);
            else playerSpeed *= 0.92;

            if (keys['KeyA']) player.rotation.y += rotSpeed;
            if (keys['KeyD']) player.rotation.y -= rotSpeed;
            if (keys['Space']) shoot(player, true);

            player.translateZ(playerSpeed);

            // カメラ位置 & シェイク（揺れ）効果
            const camDist = playerType === 'TANK' ? -15 : -11;
            const camHeight = playerType === 'TANK' ? 7.5 : 4.5;
            const camOffset = new THREE.Vector3(0, camHeight, camDist).applyQuaternion(player.quaternion);
            
            if (cameraShake > 0) {
                camOffset.x += (Math.random() - 0.5) * cameraShake;
                camOffset.y += (Math.random() - 0.5) * cameraShake;
                cameraShake *= 0.88;
            }

            camera.position.copy(player.position).add(camOffset);
            camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1.2, 0)));

            // 2. 弾の移動 & ★近接感応・当たり判定（バイクにも確実に当たる修正）
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.add(b.userData.velocity);
                b.userData.life--;

                if (b.userData.isPlayerBullet) {
                    // プレイヤーの弾 -> 敵判定
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const enemy = enemies[j];
                        // 弾と敵の中心距離を計算（高さYも考慮して甘めに判定）
                        const dist = b.position.distanceTo(enemy.position.clone().add(new THREE.Vector3(0, 1.0, 0)));
                        
                        if (dist < (b.userData.hitRadius + (enemy.userData.radius || 1.5))) {
                            createExplosion(b.position);
                            enemy.userData.hp -= b.userData.damage;
                            
                            updateEnemyHPUI(j, enemy);

                            if (enemy.userData.hp <= 0) {
                                createExplosion(enemy.position, true);
                                scene.remove(enemy);
                                enemies.splice(j, 1);
                                removeEnemyHPUI(j);

                                if (enemies.length === 0) endGame(true);
                            }

                            scene.remove(b);
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                } else {
                    // 敵の弾 -> プレイヤー判定
                    const dist = b.position.distanceTo(player.position.clone().add(new THREE.Vector3(0, 1.0, 0)));
                    if (dist < 2.5) {
                        createExplosion(b.position);
                        damagePlayer(b.userData.damage);
                        scene.remove(b);
                        bullets.splice(i, 1);
                        continue;
                    }
                }

                if (b.userData.life <= 0 && bullets[i]) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }

            // 3. 敵（AI）動作
            enemies.forEach(enemy => {
                enemy.lookAt(player.position);
                const dist = enemy.position.distanceTo(player.position);

                if (enemy.userData.type === 'BIKE') {
                    enemy.translateZ(enemy.userData.speed);
                    if (dist < 3.0) damagePlayer(0.6); // 接触ダメージ
                } else {
                    if (dist > 18) enemy.translateZ(enemy.userData.speed);
                    enemy.userData.shootCooldown++;
                    if (enemy.userData.shootCooldown > 90) {
                        shoot(enemy, false);
                        enemy.userData.shootCooldown = 0;
                    }
                }
            });

            // 4. パーティクル更新
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.vel);
                p.userData.life--;
                p.scale.multiplyScalar(0.92);
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        // UI更新関数群
        function damagePlayer(amount) {
            playerHp = Math.max(0, playerHp - amount);
            updatePlayerHPUI();
            if (playerHp <= 0) endGame(false);
        }

        function updatePlayerHPUI() {
            const percent = Math.max(0, (playerHp / maxHp) * 100);
            document.getElementById('player-hp-fill').style.width = percent + '%';
            document.getElementById('player-hp-text').innerText = `${Math.ceil(playerHp)} / ${maxHp}`;
        }

        function updateEnemyHPUI(index, enemy) {
            const fill = document.getElementById(`hp-fill-${index}`);
            if (fill) {
                const percent = Math.max(0, (enemy.userData.hp / enemy.userData.maxHp) * 100);
                fill.style.width = percent + '%';
            }
        }

        function removeEnemyHPUI(index) {
            const card = document.getElementById(`hp-card-${index}`);
            if (card) card.style.opacity = '0.3';
        }

        function endGame(isWin) {
            gameState = 'END';
            clearInterval(bgmInterval);
            const screen = document.getElementById('result-screen');
            const title = document.getElementById('result-title');
            screen.style.display = 'block';
            title.innerText = isWin ? 'VICTORY!' : 'GAME OVER';
            title.style.color = isWin ? '#00ffcc' : '#ff3300';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // エンジン起動
        initEngine();
    </script>
</body>
</html>
