<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Opposition‐WAR Real & Online</title>
    <style>
        * { touch-action: manipulation; box-sizing: border-box; }
        body {
            margin: 0; overflow: hidden; background-color: #05080c;
            font-family: 'Impact', 'Segoe UI', sans-serif; user-select: none;
        }

        /* --- UI オーバーレイ --- */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(15,25,35,0.95) 0%, rgba(5,5,10,0.98) 100%);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: #fff; z-index: 100; padding: 10px; overflow-y: auto;
        }

        h1 { font-size: 42px; margin: 0 0 5px 0; color: #ff3300; text-shadow: 0 0 20px #ff3300; }
        p.subtitle { font-size: 13px; color: #88aaff; margin-bottom: 10px; letter-spacing: 2px; }

        /* モード＆カスタマイズ */
        .panel-container { display: flex; gap: 15px; margin-bottom: 10px; flex-wrap: wrap; justify-content: center; }
        .select-card {
            background: rgba(255, 255, 255, 0.03); border: 2px solid #00aaff;
            border-radius: 8px; padding: 10px 15px; width: 150px; text-align: center; cursor: pointer;
        }
        .select-card.active { border-color: #ffaa00; background: rgba(255, 170, 0, 0.15); }
        .select-card h2 { margin: 0 0 5px 0; color: #fff; font-size: 16px; }

        .custom-section {
            background: rgba(0, 0, 0, 0.5); border: 1px solid rgba(0, 170, 255, 0.3);
            border-radius: 8px; padding: 10px; width: 100%; max-width: 440px; margin-bottom: 10px; font-family: sans-serif;
        }
        .custom-title { font-size: 12px; color: #00e1ff; margin-bottom: 6px; border-bottom: 1px solid #00e1ff; }
        .color-picker { display: flex; gap: 10px; margin-bottom: 8px; }
        .color-btn { width: 28px; height: 28px; border-radius: 50%; border: 2px solid #fff; cursor: pointer; }
        .color-btn.selected { border: 3px solid #ffff00; }

        /* オンライン対戦設定 */
        .online-box { display: flex; gap: 10px; align-items: center; margin-top: 5px; flex-wrap: wrap; }
        .online-input { padding: 6px; border-radius: 4px; border: 1px solid #00aaff; background: #112; color: #fff; width: 120px; font-size: 12px; }

        .btn-start {
            padding: 10px 35px; font-size: 20px; background: linear-gradient(45deg, #ff3300, #ff8800);
            border: none; color: #fff; font-weight: bold; cursor: pointer; border-radius: 5px; margin-top: 5px;
        }

        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        #player-hp-container {
            position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 400px; background: rgba(0,0,0,0.85); border: 2px solid #00ffcc;
            border-radius: 8px; padding: 8px 15px; text-align: center;
        }
        .player-hp-bar-bg { width: 100%; height: 16px; background: #112222; border-radius: 4px; overflow: hidden; border: 1px solid #00ffcc; }
        .player-hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #00aa66, #00ffcc); }

        /* ★ スマホ用バーチャル操作 UI ★ */
        #touch-controls {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 50; display: none;
        }
        .touch-zone { pointer-events: auto; position: absolute; }
        
        /* ジョイスティック */
        #joystick-area { bottom: 20px; left: 20px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(0,255,204,0.3); }
        #joystick-knob { position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: rgba(0,255,204,0.6); border-radius: 50%; }

        /* ボタン */
        #btn-touch-fire {
            bottom: 25px; right: 25px; width: 80px; height: 80px;
            background: rgba(255,51,0,0.6); border: 2px solid #ff6600; border-radius: 50%;
            color: #fff; font-size: 18px; font-weight: bold; display: flex; justify-content: center; align-items: center;
        }
        #btn-touch-boost {
            bottom: 115px; right: 35px; width: 60px; height: 60px;
            background: rgba(0,170,255,0.6); border: 2px solid #00ffff; border-radius: 50%;
            color: #fff; font-size: 12px; font-weight: bold; display: flex; justify-content: center; align-items: center;
        }

        #result-screen { display: none; text-align: center; z-index: 150; }
        #result-title { font-size: 50px; margin-bottom: 10px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

    <div id="select-screen" class="overlay-screen">
        <h1>Opposition‐WAR</h1>
        <p class="subtitle">REAL TANK & ONLINE BATTLE</p>

        <div class="panel-container">
            <div id="card-TANK" class="select-card active" onclick="selectMachine('TANK')">
                <h2>超リアル戦車</h2>
                <p>重装甲 ＆ 主砲</p>
            </div>
            <div id="card-BIKE" class="select-card" onclick="selectMachine('BIKE')">
                <h2>リアルバイク</h2>
                <p>超高速 ＆ 機動性</p>
            </div>
        </div>

        <div class="custom-section">
            <div class="custom-title">1. 車体カラー</div>
            <div class="color-picker">
                <div class="color-btn selected" style="background:#2e4020;" onclick="selectColor(0x2e4020, this)"></div>
                <div class="color-btn" style="background:#0088ff;" onclick="selectColor(0x0088ff, this)"></div>
                <div class="color-btn" style="background:#ff2222;" onclick="selectColor(0xff2222, this)"></div>
                <div class="color-btn" style="background:#ffaa00;" onclick="selectColor(0ffaa00, this)"></div>
                <div class="color-btn" style="background:#333338;" onclick="selectColor(0x333338, this)"></div>
            </div>

            <div class="custom-title">2. プレイモード設定</div>
            <div style="font-size:12px; display:flex; gap:15px; margin-top:5px;">
                <label><input type="radio" name="mode" value="SOLO" checked onclick="setOnlineMode(false)"> シングル(vs AI)</label>
                <label><input type="radio" name="mode" value="ONLINE" onclick="setOnlineMode(true)"> オンラインP2P対戦</label>
            </div>

            <div id="online-controls" class="online-box" style="display:none;">
                <button onclick="createRoom()" style="padding:5px 10px; font-size:11px;">部屋を作る(Host)</button>
                <span id="room-id-display" style="color:#00ffcc; font-size:11px;">ID: ---</span>
                <br>
                <input type="text" id="join-room-id" class="online-input" placeholder="部屋IDを入力">
                <button onclick="joinRoom()" style="padding:5px 10px; font-size:11px;">参加する</button>
            </div>
        </div>

        <button class="btn-start" onclick="startGame()">BATTLE START</button>
    </div>

    <div id="hud">
        <div id="player-hp-container">
            <div style="color:#00ffcc; font-size:14px; margin-bottom:2px;" id="player-name">YOUR MACHINE</div>
            <div class="player-hp-bar-bg"><div id="player-hp-fill" class="player-hp-bar-fill"></div></div>
        </div>
    </div>

    <div id="touch-controls">
        <div id="joystick-area" class="touch-zone"><div id="joystick-knob"></div></div>
        <div id="btn-touch-fire" class="touch-zone">FIRE</div>
        <div id="btn-touch-boost" class="touch-zone">BOOST</div>
    </div>

    <div id="result-screen" class="overlay-screen">
        <div id="result-title">VICTORY</div>
        <button class="btn-start" onclick="location.reload()">RETRY</button>
    </div>

    <script>
        // --- 基本変数 ---
        let scene, camera, renderer, player;
        let playerType = 'TANK', selectedColorHex = 0x2e4020;
        let isOnline = false, peer = null, conn = null, isHost = false;
        let playerHp = 100, maxHp = 100, playerSpeed = 0, maxSpeed = 0.2, rotSpeed = 0.025;
        const bullets = [], enemies = [], keys = {};
        let gameState = 'SELECT';

        // --- タッチ操作対応の判定 ---
        const isTouchDevice = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

        function selectMachine(type) {
            playerType = type;
            document.querySelectorAll('.select-card').forEach(c => c.classList.remove('active'));
            document.getElementById(`card-${type}`).classList.add('active');
        }

        function selectColor(hex, el) {
            selectedColorHex = hex;
            document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
            el.classList.add('selected');
        }

        function setOnlineMode(online) {
            isOnline = online;
            document.getElementById('online-controls').style.display = online ? 'flex' : 'none';
            if (online && !peer) initPeer();
        }

        // --- P2Pオンライン通信 (PeerJS) ---
        function initPeer() {
            peer = new Peer();
            peer.on('open', id => {
                document.getElementById('room-id-display').innerText = `ID: ${id.substring(0,5)}`;
            });
            peer.on('connection', c => {
                conn = c; isHost = true;
                setupConnection();
            });
        }

        function createRoom() {
            if (peer && peer.id) {
                alert(`部屋を作成しました！対戦相手に以下のIDを共有してください:\n${peer.id}`);
            }
        }

        function joinRoom() {
            const destId = document.getElementById('join-room-id').value.trim();
            if (destId && peer) {
                conn = peer.connect(destId);
                isHost = false;
                setupConnection();
            }
        }

        function setupConnection() {
            conn.on('open', () => {
                alert("対戦相手と接続しました！ゲームを開始できます。");
            });
            conn.on('data', data => {
                if (data.type === 'sync') {
                    if (enemies[0]) {
                        enemies[0].position.set(data.x, data.y, data.z);
                        enemies[0].rotation.y = data.rot;
                    }
                } else if (data.type === 'shoot') {
                    shoot(enemies[0], false);
                }
            });
        }

        // ★ ディテールを極めた超リアル戦車モデルの構築 ★
        function createUltraRealTank(bodyColor = 0x2e4020, isEnemy = false) {
            const tank = new THREE.Group();
            const color = isEnemy ? 0x772222 : bodyColor;
            
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.5, metalness: 0.4 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.8 });
            const metalMat = new THREE.MeshStandardMaterial({ color: 0x444444, metalness: 0.8, roughness: 0.2 });

            // 1. 車体（傾斜装甲 Front Sloped Armor）
            const mainBody = new THREE.Mesh(new THREE.BoxGeometry(3.3, 0.9, 4.6), bodyMat);
            mainBody.position.y = 0.85; mainBody.castShadow = true; tank.add(mainBody);

            const frontSlope = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.4, 1.2), bodyMat);
            frontSlope.position.set(0, 0.9, 2.4); frontSlope.rotation.x = -Math.PI / 6;
            tank.add(frontSlope);

            // 2. 履帯＆大量のロードホイール（転輪）
            [-1.8, 1.8].forEach(x => {
                // ベルト部分
                const tread = new THREE.Mesh(new THREE.BoxGeometry(0.65, 0.95, 5.2), darkMat);
                tread.position.set(x, 0.6, 0); tank.add(tread);

                // 片側6本の転輪 (Road Wheels)
                for (let i = -2.0; i <= 2.0; i += 0.8) {
                    const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.7, 12), metalMat);
                    wheel.rotation.z = Math.PI / 2; wheel.position.set(x, 0.45, i);
                    tank.add(wheel);
                }
            });

            // 3. 砲塔 (Turret) ＆ 司令塔 (Cupola) ＆ ハッチ
            const turretGroup = new THREE.Group();
            turretGroup.position.set(0, 1.4, -0.2);

            const turretMesh = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.75, 2.5), bodyMat);
            turretMesh.castShadow = true; turretGroup.add(turretMesh);

            // 司令塔 (キューポラ)
            const cupola = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 0.25, 12), darkMat);
            cupola.position.set(0.6, 0.45, -0.3); turretGroup.add(cupola);

            // 4. 主砲 ＆ マズルブレーキ（砲口）
            const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 3.8, 12), darkMat);
            cannon.rotation.x = Math.PI / 2; cannon.position.set(0, 0.15, 2.3);
            turretGroup.add(cannon);

            const muzzleBrake = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.4, 12), metalMat);
            muzzleBrake.rotation.x = Math.PI / 2; muzzleBrake.position.set(0, 0.15, 4.1);
            turretGroup.add(muzzleBrake);

            // アンテナ
            const antenna = new THREE.Mesh(new THREE.CylinderGeometry(0.01, 0.02, 2.0), metalMat);
            antenna.position.set(-0.8, 1.2, -0.8); turretGroup.add(antenna);

            tank.add(turretGroup);
            return tank;
        }

        // バイクモデル
        function createRealBike(bodyColor = 0x0088ff, isEnemy = false) {
            const bike = new THREE.Group();
            const color = isEnemy ? 0xdd2222 : bodyColor;
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.2 });
            const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 1.6), bodyMat);
            body.position.y = 0.8; bike.add(body);

            [-0.9, 0.9].forEach(z => {
                const tire = new THREE.Mesh(new THREE.TorusGeometry(0.4, 0.12, 8, 16), tireMat);
                tire.rotation.y = Math.PI / 2; tire.position.set(0, 0.4, z);
                bike.add(tire);
            });
            return bike;
        }

        // エンジン初期化
        function initEngine() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0f1923, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
            dirLight.position.set(60, 100, 50); dirLight.castShadow = true;
            scene.add(dirLight);

            const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), new THREE.MeshStandardMaterial({ color: 0x1a241a }));
            ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

            const grid = new THREE.GridHelper(500, 50, 0x00aaff, 0x224422);
            grid.position.y = 0.01; scene.add(grid);

            // キーボード操作
            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);

            // スマホ用タッチバーチャルボタンの初期化
            if (isTouchDevice) setupTouchControls();
        }

        // ★ スマホ用タッチUI制御 ★
        function setupTouchControls() {
            const joystickArea = document.getElementById('joystick-area');
            const knob = document.getElementById('joystick-knob');
            let touchId = null, startX = 0, startY = 0;

            joystickArea.addEventListener('touchstart', e => {
                const touch = e.changedTouches[0];
                touchId = touch.identifier;
                startX = touch.clientX; startY = touch.clientY;
            });

            joystickArea.addEventListener('touchmove', e => {
                for (let touch of e.changedTouches) {
                    if (touch.identifier === touchId) {
                        const dx = touch.clientX - startX;
                        const dy = touch.clientY - startY;
                        
                        knob.style.transform = `translate(${Math.max(-30, Math.min(30, dx))}px, ${Math.max(-30, Math.min(30, dy))}px)`;

                        keys['KeyW'] = dy < -10;
                        keys['KeyS'] = dy > 10;
                        keys['KeyA'] = dx < -10;
                        keys['KeyD'] = dx > 10;
                    }
                }
            });

            const resetJoystick = () => {
                knob.style.transform = 'translate(0px, 0px)';
                keys['KeyW'] = keys['KeyS'] = keys['KeyA'] = keys['KeyD'] = false;
            };

            joystickArea.addEventListener('touchend', resetJoystick);
            joystickArea.addEventListener('touchcancel', resetJoystick);

            // ボタン
            document.getElementById('btn-touch-fire').addEventListener('touchstart', e => { e.preventDefault(); shoot(player, true); });
            document.getElementById('btn-touch-boost').addEventListener('touchstart', e => { e.preventDefault(); keys['ShiftLeft'] = true; });
            document.getElementById('btn-touch-boost').addEventListener('touchend', e => { e.preventDefault(); keys['ShiftLeft'] = false; });
        }

        function startGame() {
            document.getElementById('select-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
            if (isTouchDevice) document.getElementById('touch-controls').style.display = 'block';

            if (playerType === 'TANK') {
                player = createUltraRealTank(selectedColorHex, false);
                maxHp = 120; maxSpeed = 0.2; rotSpeed = 0.025;
            } else {
                player = createRealBike(selectedColorHex, false);
                maxHp = 60; maxSpeed = 0.45; rotSpeed = 0.045;
            }

            playerHp = maxHp;
            scene.add(player);

            // 敵の生成（オンライン対戦ならプレイヤー2、シングルならAI）
            const enemyObj = (playerType === 'TANK') ? createRealBike(0xdd2222, true) : createUltraRealTank(0x662222, true);
            enemyObj.position.set(0, 0, -40);
            scene.add(enemyObj);
            enemies.push(enemyObj);

            gameState = 'PLAYING';
            animate();
        }

        function shoot(shooter, isPlayer = false) {
            const bullet = new THREE.Mesh(
                new THREE.SphereGeometry(0.3, 8, 8),
                new THREE.MeshBasicMaterial({ color: isPlayer ? 0xffff00 : 0xff3300 })
            );

            const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(shooter.quaternion);
            bullet.position.copy(shooter.position).add(new THREE.Vector3(0, 1.2, 0)).add(dir.clone().multiplyScalar(2.0));
            bullet.userData = { velocity: dir.multiplyScalar(1.5), life: 60, isPlayerBullet: isPlayer };

            scene.add(bullet); bullets.push(bullet);

            // オンライン同期
            if (isOnline && conn && isPlayer) {
                conn.send({ type: 'shoot' });
            }
        }

        function animate() {
            if (gameState !== 'PLAYING') return;
            requestAnimationFrame(animate);

            // 移動操作
            let spd = maxSpeed;
            if (keys['ShiftLeft']) spd *= 1.4;

            if (keys['KeyW']) playerSpeed = Math.min(playerSpeed + 0.01, spd);
            else if (keys['KeyS']) playerSpeed = Math.max(playerSpeed - 0.01, -spd * 0.5);
            else playerSpeed *= 0.92;

            if (keys['KeyA']) player.rotation.y += rotSpeed;
            if (keys['KeyD']) player.rotation.y -= rotSpeed;
            if (keys['Space']) shoot(player, true);

            player.translateZ(playerSpeed);

            // カメラ
            const camOffset = new THREE.Vector3(0, 6, -12).applyQuaternion(player.quaternion);
            camera.position.copy(player.position).add(camOffset);
            camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1, 0)));

            // オンライン位置送信
            if (isOnline && conn && conn.open) {
                conn.send({ type: 'sync', x: player.position.x, y: player.position.y, z: player.position.z, rot: player.rotation.y });
            }

            // 弾更新
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.add(b.userData.velocity);
                b.userData.life--;
                if (b.userData.life <= 0) { scene.remove(b); bullets.splice(i, 1); }
            }

            // シングルプレイAI制御
            if (!isOnline && enemies[0]) {
                enemies[0].lookAt(player.position);
                enemies[0].translateZ(0.1);
            }

            renderer.render(scene, camera);
        }

        initEngine();
    </script>
</body>
</html>
