<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>オンライン対戦ゲーム</title>
    <style>
        /* 全体スタイル */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            text-align: center;
        }

        /* タイトル画面スタイル */
        #title-screen {
            background-color: #16213e;
            padding: 30px 20px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 24px;
            color: #e94560;
        }

        .input-group {
            margin-bottom: 25px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            color: #4ecca3;
            font-weight: bold;
        }

        /* 対戦コード入力欄 (maxlengthなし・桁数無制限) */
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid #0f3460;
            border-radius: 8px;
            background-color: #0f3460;
            color: #fff;
            text-align: center;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #e94560;
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            padding: 16px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }
        button:active {
            transform: scale(0.97);
        }

        .btn-pc {
            background-color: #0f3460;
            color: #ffffff;
        }
        .btn-pc:hover {
            background-color: #1a4f8a;
        }

        /* スマホモード用ボタン */
        .btn-mobile {
            background-color: #e94560;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(233, 69, 96, 0.4);
        }
        .btn-mobile:hover {
            background-color: #ff5773;
        }

        /* ゲーム画面スタイル */
        #game-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .game-info {
            margin-bottom: 12px;
            font-size: 14px;
            color: #a0a0a0;
        }

        #game-canvas {
            background-color: #0f3460;
            border-radius: 12px;
            border: 3px solid #e94560;
            touch-action: none;
        }

        /* スマホモード専用コントローラー */
        #mobile-controls {
            display: none;
            margin-top: 20px;
            width: 100%;
        }

        .d-pad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 180px;
            height: 180px;
            margin: 0 auto;
        }

        .d-btn {
            background-color: #16213e;
            border: 2px solid #0f3460;
            color: #fff;
            font-size: 22px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
        }
        .d-btn:active {
            background-color: #e94560;
        }

        .btn-up { grid-column: 2; grid-row: 1; }
        .btn-left { grid-column: 1; grid-row: 2; }
        .btn-right { grid-column: 3; grid-row: 2; }
        .btn-down { grid-column: 2; grid-row: 3; }

        .back-btn {
            margin-top: 24px;
            background-color: #444;
            color: #fff;
            padding: 10px 20px;
            font-size: 14px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ================= タイトル画面 ================= -->
        <div id="title-screen">
            <h1>オンライン対戦</h1>
            
            <div class="input-group">
                <label for="room-code">対戦コード（無制限に入力可能）</label>
                <!-- maxlength属性を指定していないため無制限に入力可能です -->
                <input type="text" id="room-code" placeholder="コードを入力してください">
            </div>

            <div class="button-group">
                <button class="btn-pc" onclick="startGame(false)">通常モードでスタート</button>
                <!-- スマホモード選択ボタン -->
                <button class="btn-mobile" onclick="startGame(true)">📱 スマホモードを選択</button>
            </div>
        </div>

        <!-- ================= ゲーム画面 ================= -->
        <div id="game-screen">
            <div class="game-info">
                コード: <span id="display-code" style="color:#e94560; font-weight:bold;"></span> | 
                モード: <span id="display-mode" style="color:#4ecca3; font-weight:bold;"></span>
            </div>

            <!-- ゲーム描画領域 -->
            <canvas id="game-canvas" width="300" height="300"></canvas>

            <!-- スマホモード選択時のみ表示されるUI -->
            <div id="mobile-controls">
                <div class="d-pad">
                    <button class="d-btn btn-up" ontouchstart="move('up', event)" onclick="move('up')">▲</button>
                    <button class="d-btn btn-left" ontouchstart="move('left', event)" onclick="move('left')">◄</button>
                    <button class="d-btn btn-right" ontouchstart="move('right', event)" onclick="move('right')">►</button>
                    <button class="d-btn btn-down" ontouchstart="move('down', event)" onclick="move('down')">▼</button>
                </div>
            </div>

            <button class="back-btn" onclick="backToTitle()">タイトルに戻る</button>
        </div>
    </div>

    <script>
        let isMobileMode = false;
        let playerPos = { x: 130, y: 130 };
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');

        // ゲーム開始処理
        function startGame(mobile) {
            const codeInput = document.getElementById('room-code').value.trim();
            if (!codeInput) {
                alert('対戦コードを入力してください');
                return;
            }

            isMobileMode = mobile;

            // 画面切替
            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'flex';

            // 情報の反映
            document.getElementById('display-code').textContent = codeInput;
            document.getElementById('display-mode').textContent = isMobileMode ? 'スマホモード' : '通常モード';

            // スマホモード用操作画面の切り替え
            const mobileControls = document.getElementById('mobile-controls');
            if (isMobileMode) {
                mobileControls.style.display = 'block';
            } else {
                mobileControls.style.display = 'none';
            }

            // 初期位置設定＆描画
            playerPos = { x: 130, y: 130 };
            drawGame();
        }

        // タイトルへ戻る
        function backToTitle() {
            document.getElementById('game-screen').style.display = 'none';
            document.getElementById('title-screen').style.display = 'block';
        }

        // 移動処理
        function move(dir, e) {
            if (e) e.preventDefault(); // タッチの連打防止
            const step = 20;
            if (dir === 'up' && playerPos.y > 0) playerPos.y -= step;
            if (dir === 'down' && playerPos.y < canvas.height - 40) playerPos.y += step;
            if (dir === 'left' && playerPos.x > 0) playerPos.x -= step;
            if (dir === 'right' && playerPos.x < canvas.width - 40) playerPos.x += step;
            drawGame();
        }

        // PCキーボード操作対応
        window.addEventListener('keydown', (e) => {
            if (document.getElementById('game-screen').style.display === 'flex') {
                if (e.key === 'ArrowUp' || e.key === 'w') move('up');
                if (e.key === 'ArrowDown' || e.key === 's') move('down');
                if (e.key === 'ArrowLeft' || e.key === 'a') move('left');
                if (e.key === 'ArrowRight' || e.key === 'd') move('right');
            }
        });

        // 描画処理
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            // プレイヤー（ピンク色の正方形）
            ctx.fillStyle = '#e94560';
            ctx.fillRect(playerPos.x, playerPos.y, 40, 40);

            // 操作指示メッセージ
            ctx.fillStyle = '#ffffff';
            ctx.font = '12px Arial';
            ctx.fillText(isMobileMode ? '画面下の矢印で操作' : 'キーボード(矢印/WASD)で操作', 10, 20);
        }
    </script>
</body>
</html>
