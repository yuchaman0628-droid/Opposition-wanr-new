<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Smooth Network Movement</title>
  <style>
    canvas { background: #1a1a1a; display: block; margin: 20px auto; border: 2px solid #fff; }
  </style>
</head>
<body>
<canvas id="game" width="600" height="400"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 1P（自分）の位置情報
const myPlayer = { x: 100, y: 200, size: 20, color: '#00ff00', speed: 4 };

// 2P（相手）の位置情報：描画位置(x, y) と 受信した目標位置(targetX, targetY) を分けて管理
const remotePlayer = {
  x: 500, y: 200,             // 実際に描画されるヌルヌル動く座標
  targetX: 500, targetY: 200, // 通信で受け取った最新の座標
  size: 20, color: '#ff0000'
};

// キー入力の状態
const keys = {};
window.addEventListener('keydown', e => keys[e.key] = true);
window.addEventListener('keyup', e => keys[e.key] = false);

// 【線形補間（Lerp）関数】現在地から目的地へ少しずつ近づける
function lerp(start, end, amt) {
  return start + (end - start) * amt;
}

// ネットワークから相手の座標を受信した時に呼ぶ処理
function onReceiveRemoteData(data) {
  // 直接 x, y を書き換えずに、目標点だけを更新する（これがカクつき防止の肝）
  remotePlayer.targetX = data.x;
  remotePlayer.targetY = data.y;
}

function update() {
  // --- 1P（自分）の移動処理 ---
  let moved = false;
  if (keys['ArrowUp'] || keys['w']) { myPlayer.y -= myPlayer.speed; moved = true; }
  if (keys['ArrowDown'] || keys['s']) { myPlayer.y += myPlayer.speed; moved = true; }
  if (keys['ArrowLeft'] || keys['a']) { myPlayer.x -= myPlayer.speed; moved = true; }
  if (keys['ArrowRight'] || keys['d']) { myPlayer.x += myPlayer.speed; moved = true; }

  // 自分の位置が変わったら通信相手へ送信
  if (moved) {
    sendNetworkData({ x: myPlayer.x, y: myPlayer.y });
  }

  // --- 2P（相手）の描画位置の滑らか補間処理 ---
  // 0.2 は追従スピード（0.1〜0.3で調整。小さくするとヌルヌル、大きくするとレスポンス優先）
  remotePlayer.x = lerp(remotePlayer.x, remotePlayer.targetX, 0.2);
  remotePlayer.y = lerp(remotePlayer.y, remotePlayer.targetY, 0.2);
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // 自分（緑）を描画
  ctx.fillStyle = myPlayer.color;
  ctx.fillRect(myPlayer.x, myPlayer.y, myPlayer.size, myPlayer.size);

  // 相手（赤）を描画
  ctx.fillStyle = remotePlayer.color;
  ctx.fillRect(remotePlayer.x, remotePlayer.y, remotePlayer.size, remotePlayer.size);
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

// 通信処理のモック（PeerJSやWebSocketなどの send 処理に置き換えてください）
function sendNetworkData(data) {
  // ネットワークの遅延・ラグを想定したテスト用コード
  setTimeout(() => {
    onReceiveRemoteData(data);
  }, 50); // 50msの通信遅延を再現
}

// ゲームループ開始
gameLoop();
</script>
</body>
</html>
