<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Opposition‐WAR</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05080c;
            font-family: 'Impact', 'Segoe UI', sans-serif;
            user-select: none;
        }

        /* --- UI オーバーレイ（タイトル・UI共通） --- */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(15,25,35,0.95) 0%, rgba(5,5,10,0.98) 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
            z-index: 100;
        }

        h1 {
            font-size: 56px;
            margin: 0 0 5px 0;
            letter-spacing: 4px;
            color: #ff3300;
            text-shadow: 0 0 20px #ff3300, 3px 3px 0px #000;
        }

        p.subtitle {
            font-size: 16px;
            color: #88aaff;
            margin-bottom: 25px;
            letter-spacing: 3px;
        }

        /* カード選択 */
        .card-container {
            display: flex;
            gap: 25px;
            margin-bottom: 25px;
        }

        .select-card {
            background: rgba(255, 255, 255, 0.03);
            border: 2px solid #00aaff;
            border-radius: 8px;
            padding: 20px;
            width: 200px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }

        .select-card:hover {
            background: rgba(0, 170, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(0, 170, 255, 0.5);
        }

        .select-card h2 { margin: 0 0 10px 0; color: #fff; font-size: 22px; }
        .select-card p { font-size: 13px; color: #ccc; margin: 0; font-family: sans-serif; }

        /* メニュー（操作説明・オプション） */
        .menu-panel {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 170, 255, 0.3);
            border-radius: 8px;
            padding: 15px 25px;
            width: 450px;
            margin-top: 10px;
            font-family: sans-serif;
            font-size: 14px;
        }

        .menu-panel h3 {
            margin: 0 0 10px 0;
            color: #00e1ff;
            font-size: 16px;
            border-bottom: 1px solid #00e1ff;
            padding-bottom: 4px;
        }

        .control-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            color: #ddd;
        }

        .option-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        input[type=range] {
            width: 180px;
            accent-color: #00aaff;
            cursor: pointer;
        }

        /* --- ゲーム内 HUD --- */
        #hud {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            display: none;
        }

        /* 画面上部：敵HP */
        #enemy-hp-container {
            position: absolute;
            top: 20px; left: 50%;
            transform: translateX(-50%);
            display: flex; gap: 15px;
        }

        .enemy-hp-card {
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid #ff3333;
            padding: 6px 12px;
            border-radius: 5px;
            width: 160px;
            text-align: center;
            color: #fff;
        }

        .enemy-hp-title { font-size: 12px; color: #ff6666; margin-bottom: 3px; }
        .enemy-hp-bar-bg { width: 100%; height: 10px; background: #333; border-radius: 2px; overflow: hidden; }
        .enemy-hp-bar-fill { width: 100%; height: 100%; background: #ff3300; transition: width 0.1s; }

        /* 画面下部：自分HP (大きく表示) */
        #player-hp-container {
            position: absolute;
            bottom: 25px; left: 50%;
            transform: translateX(-50%);
            width: 480px;
            background: rgba(0, 0, 0, 0.85);
            border: 2px solid #00ffcc;
            border-radius: 8px;
            padding: 12px 20px;
            box-shadow: 0 0 20px rgba(0, 255, 204, 0.3);
            text-align: center;
        }

        .player-hp-header {
            display: flex; justify-content: space-between;
            color: #00ffcc; font-size: 20px; margin-bottom: 6px;
        }

        .player-hp-bar-bg {
            width: 100%; height: 24px;
            background: #112222; border-radius: 4px; overflow: hidden;
            border: 1px solid #00ffcc;
        }

        .player-hp-bar-fill {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #00aa66, #00ffcc);
            transition: width 0.1s;
        }

        /* リザルト画面 */
        #result-screen {
            display: none;
            text-align: center;
            z-index: 150;
        }

        #result-title { font-size: 64px; margin-bottom: 20px; }
        .btn-retry {
            padding: 12px 30px; font-size: 20px; background: #ff3300;
            border: none; color: #fff; cursor: pointer; font-weight: bold; border-radius: 4px;
        }
        .btn-retry:hover { background: #ff6600; }
    </style>
    <!-- Three.js 3Dライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <!-- 1. タイトル＆設定画面 -->
    <div id="select-screen" class="overlay-screen">
        <h1>Opposition‐WAR</h1>
        <p class="subtitle">SELECT MACHINE TO START</p>

        <!-- マシン選択 -->
        <div class="card-container">
            <div class="select-card" onclick="startGame('TANK')">
                <h2>重戦車 (TANK)</h2>
                <p>圧倒的防護力と主砲<br>VS バイク 2体</p>
            </div>
            <div class="select-card" onclick="startGame('BIKE')">
                <h2>リアルバイク (BIKE)</h2>
                <p>超高速＆超機動性<br>VS 重戦車 2体</p>
            </div>
        </div>

        <!-- 操作説明 ＆ オプションパネル -->
        <div class="menu-panel">
            <h3>操作方法 (CONTROLS)</h3>
            <div class="control-grid">
                <div>[W] 前進 / 加速</div>
                <div>[S] 後退 / 減速</div>
                <div>[A] / [D] 左右旋回</div>
                <div>[SPACE] 砲撃 / 射撃</div>
                <div>[Shift] ブースト (バイク専用)</div>
            </div>

            <h3 style="margin-top: 15px;">オプション (OPTIONS)</h3>
            <div class="option-row">
                <span>BGM 音量:</span>
                <input type="range" id="bgm-volume" min="0" max="1" step="0.05" value="0.3" oninput="updateVolume()">
            </div>
            <div class="option-row">
                <span>効果音 (SE) 音量:</span>
                <input type="range" id="se-volume" min="0" max="1" step="0.05" value="0.5" oninput="updateVolume()">
            </div>
        </div>
    </div>

    <!-- 2. HUD (画面UI) -->
    <div id="hud">
        <div id="enemy-hp-container"></div>

        <div id="player-hp-container">
            <div class="player-hp-header">
                <span id="player-name">YOUR MACHINE</span>
                <span id="player-hp-text">100 / 100</span>
            </div>
            <div class="player-hp-bar-bg">
                <div id="player-hp-fill" class="player-hp-bar-fill"></div>
            </div>
        </div>
    </div>

    <!-- 3. リザルト画面 -->
    <div id="result-screen" class="overlay-screen">
        <div id="result-title">VICTORY</div>
        <button class="btn-retry" onclick="location.reload()">RETRY</button>
    </div>

    <script>
        // --- Web Audio API（サウンド合成エンジン） ---
        let audioCtx = null;
        let bgmGainNode = null, seGainNode = null;
        let bgmInterval = null;
        let bgmVol = 0.3, seVol = 0.5;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                bgmGainNode = audioCtx.createGain();
                seGainNode = audioCtx.createGain();
                
                bgmGainNode.connect(audioCtx.destination);
                seGainNode.connect(audioCtx.destination);
                
                updateVolume();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function updateVolume() {
            bgmVol = parseFloat(document.getElementById('bgm-volume').value);
            seVol = parseFloat(document.getElementById('se-volume').value);
            if (bgmGainNode) bgmGainNode.gain.setValueAtTime(bgmVol, audioCtx.currentTime);
            if (seGainNode) seGainNode.gain.setValueAtTime(seVol, audioCtx.currentTime);
        }

        // SE: 発射音
        function playShootSound(isHeavy) {
            if (!audioCtx || seVol === 0) return;
            const now = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = isHeavy ? 'sawtooth' : 'square';
            osc.frequency.setValueAtTime(isHeavy ? 150 : 600, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + (isHeavy ? 0.3 : 0.1));

            gain.gain.setValueAtTime(1.0, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + (isHeavy ? 0.3 : 0.1));

            osc.connect(gain);
            gain.connect(seGainNode);
            osc.start(now);
            osc.stop(now + (isHeavy ? 0.3 : 0.1));
        }

        // SE: 爆発音
        function playExplosionSound() {
            if (!audioCtx || seVol === 0) return;
            const now = audioCtx.currentTime;
            const bufferSize = audioCtx.sampleRate * 0.5;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300, now);
            filter.frequency.exponentialRampToValueAtTime(20, now + 0.5);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(1.0, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + 0.5);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(seGainNode);
            noise.start(now);
        }

        // BGM生成ループ（サイバーバトル調）
        function startBGM() {
            if (!audioCtx) return;
            let step = 0;
            const notes = [110, 110, 130, 110, 146, 130, 110, 98]; // ベースライン

            bgmInterval = setInterval(() => {
                if (gameState !== 'PLAYING' || bgmVol === 0) return;
                const now = audioCtx.currentTime;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(notes[step % notes.length], now);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);

                osc.connect(gain);
                gain.connect(bgmGainNode);
                osc.start(now);
                osc.stop(now + 0.2);

                step++;
            }, 180);
        }

        // --- Three.js 3Dゲーム構築 ---
        let scene, camera, renderer;
        let player, playerType = 'TANK';
        let playerHp = 100, maxHp = 100;
        let playerSpeed = 0, maxSpeed = 0.22, rotSpeed = 0.025;
        
        const bullets = [];
        const enemies = [];
        const particles = [];
        const keys = {};
        let gameState = 'SELECT';

        // リアルなバイクモデル（軽量かつディテールを大幅向上）
        function createRealBike(isEnemy = false) {
            const bike = new THREE.Group();
            const color = isEnemy ? 0xdd2222 : 0x0088ff;
            
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.1, metalness: 0.8 });
            const frameMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
            const chromeMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, metalness: 0.95, roughness: 0.05 });
            const tireMat = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 });
            const glassMat = new THREE.MeshPhysicalMaterial({ color: 0xffffff, transparent: true, opacity: 0.4, roughness: 0.1 });

            // 1. 流線形メインボディ（カウル）
            const cowl = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.6, 8), bodyMat);
            cowl.rotation.x = Math.PI / 2;
            cowl.position.set(0, 0.85, 0.4);
            cowl.scale.set(1, 1, 0.8);
            cowl.castShadow = true;
            bike.add(cowl);

            // タンク
            const tank = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.4, 0.8), bodyMat);
            tank.position.set(0, 1.0, -0.2);
            tank.castShadow = true;
            bike.add(tank);

            // ウインドシールド (風防)
            const windshield = new THREE.Mesh(new THREE.PlaneGeometry(0.35, 0.35), glassMat);
            windshield.position.set(0, 1.2, 0.7);
            windshield.rotation.x = -Math.PI / 4;
            bike.add(windshield);

            // 2. エンジンブロック
            const engine = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.4, 0.6), chromeMat);
            engine.position.set(0, 0.65, -0.1);
            bike.add(engine);

            // マフラー (左右)
            [-0.25, 0.25].forEach(x => {
                const exhaust = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.08, 1.2), chromeMat);
                exhaust.rotation.x = Math.PI / 2 + 0.1;
                exhaust.position.set(x, 0.55, -0.8);
                bike.add(exhaust);
            });

            // 3. スポークホイール ＆ タイヤ (前輪・後輪)
            const createWheel = (z, scale) => {
                const wGroup = new THREE.Group();
                // タイヤ外輪
                const tire = new THREE.Mesh(new THREE.TorusGeometry(0.4 * scale, 0.12 * scale, 8, 20), tireMat);
                tire.castShadow = true;
                wGroup.add(tire);
                // ブレーキディスク
                const disc = new THREE.Mesh(new THREE.CylinderGeometry(0.28 * scale, 0.28 * scale, 0.02, 12), chromeMat);
                disc.rotation.x = Math.PI / 2;
                wGroup.add(disc);

                wGroup.position.set(0, 0.52 * scale, z);
                return wGroup;
            };

            const frontWheel = createWheel(1.1, 1.0);
            const backWheel = createWheel(-1.0, 1.1); // 後輪を少し太く
            bike.add(frontWheel);
            bike.add(backWheel);

            // フロントフォーク
            const fork = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 1.0), chromeMat);
            fork.position.set(0, 0.85, 0.9);
            fork.rotation.x = -Math.PI / 8;
            bike.add(fork);

            // 4. ライダー (ヘルメット ＆ 前傾姿勢の胴体)
            const riderGroup = new THREE.Group();
            const helmet = new THREE.Mesh(new THREE.SphereGeometry(0.24, 10, 10), frameMat);
            helmet.position.set(0, 1.35, 0.1);
            // シールド
            const visor = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.1, 0.15), chromeMat);
            visor.position.set(0, 1.35, 0.22);
            riderGroup.add(helmet); riderGroup.add(visor);

            const body = new THREE.Mesh(new THREE.BoxGeometry(0.45, 0.4, 0.6), frameMat);
            body.position.set(0, 1.1, -0.2);
            body.rotation.x = Math.PI / 6; // レーシング姿勢
            riderGroup.add(body);

            bike.add(riderGroup);
            return bike;
        }

        // 戦車モデル（軽量版）
        function createDetailedTank(isEnemy = false) {
            const tank = new THREE.Group();
            const color = isEnemy ? 0x662222 : 0x2e4020;
            const bodyMat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.6 });
            const darkMat = new THREE.MeshStandardMaterial({ color: 0x111111 });

            // 車体
            const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.0, 4.8), bodyMat);
            body.position.y = 0.8; body.castShadow = true;
            tank.add(body);

            // 履帯
            [-1.7, 1.7].forEach(x => {
                const tread = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 5.0), darkMat);
                tread.position.set(x, 0.65, 0);
                tank.add(tread);
            });

            // 砲塔 ＆ 砲身
            const turret = new THREE.Group();
            turret.position.set(0, 1.3, 0);
            const tMesh = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.8, 2.2), bodyMat);
            tMesh.castShadow = true;
            turret.add(tMesh);

            const cannon = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.18, 3.5), darkMat);
            cannon.rotation.x = Math.PI / 2;
            cannon.position.set(0, 0.2, 2.0);
            turret.add(cannon);

            tank.add(turret);
            return tank;
        }

        // 初期化
        function initEngine() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0f1923, 0.008);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // 照明
            scene.add(new THREE.AmbientLight(0xffffff, 0.5));
            const dirLight = new THREE.DirectionalLight(0xfffaed, 0.8);
            dirLight.position.set(60, 100, 50);
            dirLight.castShadow = true;
            scene.add(dirLight);

            // 地面 (軽量なシンプルグリッド地表)
            const ground = new THREE.Mesh(
                new THREE.PlaneGeometry(500, 500),
                new THREE.MeshStandardMaterial({ color: 0x1a241a, roughness: 0.9 })
            );
            ground.rotation.x = -Math.PI / 2;
            ground.receiveShadow = true;
            scene.add(ground);

            const grid = new THREE.GridHelper(500, 50, 0x00aaff, 0x224422);
            grid.position.y = 0.01;
            scene.add(grid);

            window.addEventListener('keydown', e => keys[e.code] = true);
            window.addEventListener('keyup', e => keys[e.code] = false);
            window.addEventListener('resize', onWindowResize);
        }

        // ゲーム開始
        function startGame(type) {
            initAudio();
            playerType = type;
            document.getElementById('select-screen').style.display = 'none';
            document.getElementById('hud').style.display = 'block';

            if (playerType === 'TANK') {
                player = createDetailedTank(false);
                maxHp = 100; playerHp = 100;
                maxSpeed = 0.22; rotSpeed = 0.025;
                document.getElementById('player-name').innerText = '重戦車 (YOUR TANK)';
                
                spawnEnemy('BIKE', 'バイク A');
                spawnEnemy('BIKE', 'バイク B');
            } else {
                player = createRealBike(false);
                maxHp = 60; playerHp = 60;
                maxSpeed = 0.48; rotSpeed = 0.045;
                document.getElementById('player-name').innerText = 'リアルバイク (YOUR BIKE)';

                spawnEnemy('TANK', '重戦車 ALPHA');
                spawnEnemy('TANK', '重戦車 BETA');
            }

            scene.add(player);
            updatePlayerHPUI();
            startBGM();

            gameState = 'PLAYING';
            animate();
        }

        function spawnEnemy(type, name) {
            let enemyObj;
            const angle = Math.random() * Math.PI * 2;
            const dist = 50 + Math.random() * 20;

            if (type === 'BIKE') {
                enemyObj = createRealBike(true);
                enemyObj.userData = { type: 'BIKE', name: name, hp: 35, maxHp: 35, speed: 0.24, radius: 2.2 };
            } else {
                enemyObj = createDetailedTank(true);
                enemyObj.userData = { type: 'TANK', name: name, hp: 120, maxHp: 120, speed: 0.09, radius: 3.5, shootCooldown: 0 };
            }

            enemyObj.position.x = Math.sin(angle) * dist;
            enemyObj.position.z = Math.cos(angle) * dist;
            scene.add(enemyObj);
            enemies.push(enemyObj);

            // 敵HP UI
            const container = document.getElementById('enemy-hp-container');
            const card = document.createElement('div');
            card.className = 'enemy-hp-card';
            card.id = `hp-card-${enemies.indexOf(enemyObj)}`;
            card.innerHTML = `
                <div class="enemy-hp-title">${name}</div>
                <div class="enemy-hp-bar-bg"><div class="enemy-hp-bar-fill" id="hp-fill-${enemies.indexOf(enemyObj)}"></div></div>
            `;
            container.appendChild(card);
        }

        let lastShotTime = 0;
        function shoot(shooter, isPlayer = false) {
            const now = Date.now();
            const isHeavy = (isPlayer && playerType === 'TANK') || (!isPlayer && shooter.userData.type === 'TANK');
            const coolTime = isHeavy ? 500 : 120;

            if (isPlayer && now - lastShotTime < coolTime) return;
            if (isPlayer) lastShotTime = now;

            playShootSound(isHeavy);

            const bullet = new THREE.Mesh(
                new THREE.SphereGeometry(isHeavy ? 0.35 : 0.18, 8, 8),
                new THREE.MeshBasicMaterial({ color: isPlayer ? 0xffff00 : 0xff3300 })
            );

            const dir = new THREE.Vector3(0, 0, 1).applyQuaternion(shooter.quaternion);
            bullet.position.copy(shooter.position).add(new THREE.Vector3(0, 1.2, 0)).add(dir.clone().multiplyScalar(2.5));

            bullet.userData = { 
                velocity: dir.multiplyScalar(isHeavy ? 1.4 : 1.8), 
                life: 80, 
                isPlayerBullet: isPlayer,
                damage: isHeavy ? 40 : 12,
                hitRadius: isHeavy ? 2.8 : 1.8 // ★判定エリア（バイクに確実に当たるよう補正）
            };

            scene.add(bullet);
            bullets.push(bullet);
        }

        function createExplosion(pos) {
            playExplosionSound();
            for (let i = 0; i < 15; i++) {
                const p = new THREE.Mesh(
                    new THREE.SphereGeometry(Math.random() * 0.3 + 0.1, 6, 6),
                    new THREE.MeshBasicMaterial({ color: 0xff5500 })
                );
                p.position.copy(pos);
                p.userData = {
                    vel: new THREE.Vector3((Math.random() - 0.5) * 0.6, Math.random() * 0.4, (Math.random() - 0.5) * 0.6),
                    life: 25
                };
                scene.add(p);
                particles.push(p);
            }
        }

        // ループ処理
        function animate() {
            if (gameState !== 'PLAYING') return;
            requestAnimationFrame(animate);

            // 1. 操作
            let currentMaxSpeed = maxSpeed;
            if (keys['ShiftLeft'] && playerType === 'BIKE') currentMaxSpeed *= 1.5;

            if (keys['KeyW']) playerSpeed = Math.min(playerSpeed + 0.01, currentMaxSpeed);
            else if (keys['KeyS']) playerSpeed = Math.max(playerSpeed - 0.01, -currentMaxSpeed * 0.5);
            else playerSpeed *= 0.92;

            if (keys['KeyA']) player.rotation.y += rotSpeed;
            if (keys['KeyD']) player.rotation.y -= rotSpeed;
            if (keys['Space']) shoot(player, true);

            player.translateZ(playerSpeed);

            // カメラ追従
            const camDist = playerType === 'TANK' ? -14 : -9;
            const camHeight = playerType === 'TANK' ? 7 : 4;
            const camOffset = new THREE.Vector3(0, camHeight, camDist).applyQuaternion(player.quaternion);
            camera.position.copy(player.position).add(camOffset);
            camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 1.0, 0)));

            // 2. 弾移動＆命中判定
            for (let i = bullets.length - 1; i >= 0; i--) {
                const b = bullets[i];
                b.position.add(b.userData.velocity);
                b.userData.life--;

                if (b.userData.isPlayerBullet) {
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const enemy = enemies[j];
                        const dist = b.position.distanceTo(enemy.position.clone().add(new THREE.Vector3(0, 0.8, 0)));
                        
                        if (dist < (b.userData.hitRadius + enemy.userData.radius)) {
                            createExplosion(b.position);
                            enemy.userData.hp -= b.userData.damage;
                            
                            // 敵HP更新
                            const fill = document.getElementById(`hp-fill-${j}`);
                            if (fill) fill.style.width = Math.max(0, (enemy.userData.hp / enemy.userData.maxHp) * 100) + '%';

                            if (enemy.userData.hp <= 0) {
                                createExplosion(enemy.position);
                                scene.remove(enemy);
                                enemies.splice(j, 1);
                                if (enemies.length === 0) endGame(true);
                            }

                            scene.remove(b);
                            bullets.splice(i, 1);
                            break;
                        }
                    }
                } else {
                    const dist = b.position.distanceTo(player.position.clone().add(new THREE.Vector3(0, 0.8, 0)));
                    if (dist < 2.2) {
                        createExplosion(b.position);
                        damagePlayer(b.userData.damage);
                        scene.remove(b);
                        bullets.splice(i, 1);
                        continue;
                    }
                }

                if (b.userData.life <= 0 && bullets[i]) {
                    scene.remove(b);
                    bullets.splice(i, 1);
                }
            }

            // 3. 敵AI
            enemies.forEach(enemy => {
                enemy.lookAt(player.position);
                const dist = enemy.position.distanceTo(player.position);

                if (enemy.userData.type === 'BIKE') {
                    enemy.translateZ(enemy.userData.speed);
                    if (dist < 2.5) damagePlayer(0.5);
                } else {
                    if (dist > 16) enemy.translateZ(enemy.userData.speed);
                    enemy.userData.shootCooldown++;
                    if (enemy.userData.shootCooldown > 90) {
                        shoot(enemy, false);
                        enemy.userData.shootCooldown = 0;
                    }
                }
            });

            // 4. パーティクル
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.position.add(p.userData.vel);
                p.userData.life--;
                p.scale.multiplyScalar(0.92);
                if (p.userData.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            renderer.render(scene, camera);
        }

        function damagePlayer(amount) {
            playerHp = Math.max(0, playerHp - amount);
            updatePlayerHPUI();
            if (playerHp <= 0) endGame(false);
        }

        function updatePlayerHPUI() {
            const percent = Math.max(0, (playerHp / maxHp) * 100);
            document.getElementById('player-hp-fill').style.width = percent + '%';
            document.getElementById('player-hp-text').innerText = `${Math.ceil(playerHp)} / ${maxHp}`;
        }

        function endGame(isWin) {
            gameState = 'END';
            clearInterval(bgmInterval);
            const screen = document.getElementById('result-screen');
            const title = document.getElementById('result-title');
            screen.style.display = 'flex';
            title.innerText = isWin ? 'VICTORY!' : 'GAME OVER';
            title.style.color = isWin ? '#00ffcc' : '#ff3300';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        initEngine();
    </script>
</body>
</html>
